# Production override: attach the faucet to an existing nginx-proxy network and
# let the proxy (jwilder/nginx-proxy or similar) terminate TLS/letsencrypt.
#
# Usage:
#   docker network inspect nginx-proxy_default >/dev/null || docker network create nginx-proxy_default
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# IMPORTANT: nginx must be configured to pass X-Forwarded-For from ITS OWN
# source IP (not blindly). Put the docker bridge networks your proxies live on
# into TRUSTED_PROXY_CIDRS in .env. Requests arriving from any other network
# are treated as direct clients and their X-Forwarded-For is ignored.

networks:
  default:
  nginx-proxy:
    name: nginx-proxy_default
    external: true
